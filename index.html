    <!-- PWA: installeerbaar via "Toevoegen aan beginscherm", zodat de tuindata
         buiten Safari's opslagopruiming voor gewone tabbladen valt. -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#486234" />

    <!-- iOS neemt manifest.json niet over voor standalone-gedrag; dit is nodig
         zodat "Toevoegen aan beginscherm" zonder Safari-chrome opent. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TuinTaak" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Ubuntu+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
